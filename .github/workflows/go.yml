# Builds, signs and publishes a release with GoReleaser whenever a tag matching
# "v*" (e.g. v1.7.1) is pushed.
#
# Signing uses crazy-max/ghaction-import-gpg, which reads the private key from
# the `GPG_PRIVATE_KEY` secret and its passphrase from the `PASSPHRASE` secret.
# The key's fingerprint is handed to GoReleaser as GPG_FINGERPRINT; the signing
# step in .goreleaser.yml passes `--batch` so gpg runs non-interactively.
#
# The release notes are the tag's section of CHANGELOG.md, extracted by
# scripts/release_notes.sh. The release fails if that section is missing, so
# add the CHANGELOG.md entry before tagging.
#
name: release
on:
  push:
    tags:
      - 'v*'
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          # GoReleaser needs the full history and all tags to build the release.
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      -
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Extract release notes from CHANGELOG.md
        run: scripts/release_notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
