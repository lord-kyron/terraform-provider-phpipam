# GoReleaser configuration for the Terraform Registry.
# https://goreleaser.com  |  https://developer.hashicorp.com/terraform/registry/providers/publishing
version: 2

before:
  hooks:
    # Fail the release if go.mod/go.sum are not tidy, instead of silently
    # rewriting them (which would desync the vendor/ directory).
    - go mod tidy -diff

builds:
  - env:
      # Static binaries: no CGO, so they run anywhere Terraform does
      # (including Terraform Cloud agents without system libraries).
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      # windows/arm (32-bit) was removed in Go 1.26.
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      # --batch: non-interactive signing in CI.
      - --batch
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - ${signature}
      - --detach-sign
      - ${artifact}

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # To review a release before it goes live, uncomment:
  # draft: true

# The release notes come from CHANGELOG.md via --release-notes (see
# .github/workflows/go.yml). The changelog step must stay enabled, as it is
# also what loads that file; with a notes file given, no changelog is
# generated from git history.
